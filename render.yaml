services:
  - type: web
    name: mlam-studio-pro
    runtime: node
    region: frankfurt
    # Free plan: no persistent disk, and the service sleeps after 15 minutes
    # without visitors. DATABASE_URL and the four R2_* values are REQUIRED here,
    # otherwise the database and uploads are wiped on every restart.
    plan: free
    # The project uses npm (package-lock.json); there is no pnpm lockfile.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MLAM_BIND_HOST
        value: 0.0.0.0
      # Temporary scratch space only (free instances have no persistent disk).
      - key: MLAM_DATA_DIR
        value: /tmp/mlam-data
      - key: MLAM_TRUST_PROXY_IP
        value: "0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Values below are entered privately in the Render dashboard.
      - key: MLAM_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: MLAM_ADMIN_EMAIL
        sync: false
      # REQUIRED on the free plan: Supabase Postgres (Session pooler URL).
      - key: DATABASE_URL
        sync: false
      # REQUIRED on the free plan: Cloudflare R2 for uploads (all four).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Optional: email from the admin through Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: MLAM_EMAIL_FROM
        sync: false
